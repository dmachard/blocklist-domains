name: Build
on:
  push:
    branches:
      - main 
  schedule:
    # At the end of every day
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
      with:
        # checkout all branches
        fetch-depth: 0
        
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "setuptools<82" blocklist_aggregator pybadges standard-imghdr
        
    - name: Generate blocklists and badges
      run: |
        python3 blocklist.py
        python3 badges.py
        mkdir -p /tmp/build
        cp -rf *.txt *.svg *.cdb /tmp/build/
        
    - name: Remove remote data branch
      if: ${{ success() }}
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git push origin :data || true
        
    - name: Checkout
      if: ${{ success() }}
      run: |
        git checkout --orphan data
        git rm -rf .
        cp -rf /tmp/build/* .
        
    - name: Add files
      if: ${{ success() }}
      run: |
        git add .
        
    - name: Commit Push
      if: ${{ success() }}
      run: |
        git commit -m "blocklist generated"
        git push origin data
